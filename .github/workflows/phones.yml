name: Phone recognition (audio to IPA)
# Runs phone-recognition models over the clips and compares what they hear with the IPA of the word list.
# Each model runs in its own job (split into `shards` jobs when the list is long); a last job scores them all and
# commits checks/phones/<list name>/ (raw outputs, compare.tsv, report.md) to the branch it runs on.  Outputs of earlier runs on the same list
# stay, so models can be run one at a time.
on:
  workflow_dispatch:
    inputs:
      list:   { description: "Rows to check (TSV with form, file, ipa columns)", default: "checks/sample.tsv" }
      models: { description: "Models, comma-separated: xeus, zipa, powsm, w2v2", default: "xeus,zipa,powsm,w2v2" }
      shards: { description: "Jobs per model (the list is split between them)", default: "1" }
      audio:  { description: "fetch = download each clip (short lists); checkout = check out audio/ (long lists)", default: "fetch" }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.m.outputs.matrix }}" }
    steps:
      - id: m
        env: { MODELS: "${{ inputs.models }}", SHARDS: "${{ inputs.shards }}" }
        run: |
          python3 -c 'import json, os; ms = [m.strip() for m in os.environ["MODELS"].split(",") if m.strip()]; n = int(os.environ["SHARDS"]); print("matrix=" + json.dumps({"include": [{"model": m, "shard": i, "of": n} for m in ms for i in range(n)]}))' >> "$GITHUB_OUTPUT"
  recognize:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            checks
            next
            ${{ inputs.audio == 'checkout' && 'audio' || 'scripts' }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-v1
      - name: Install
        run: |
          pip install -q numpy==1.26.4 imageio-ffmpeg          # imageio-ffmpeg: a static ffmpeg (the runner has none)
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          case "${{ matrix.model }}" in
            xeus)  pip install -q "transformers<5" huggingface_hub safetensors soundfile pyyaml typeguard ;;   # its remote code predates transformers 5
            w2v2)  sudo apt-get install -y -q espeak-ng >/dev/null; pip install -q transformers phonemizer ;;
            powsm) pip install -q espnet espnet_model_zoo ;;
            zipa)  pip install -q onnxruntime soundfile librosa lhotse huggingface_hub
                   git clone -q --depth 1 https://github.com/lingjzhu/zipa "$RUNNER_TEMP/zipa" ;;
          esac
          pip list 2>/dev/null | grep -i -E "^(torch|transformers|espnet|onnxruntime|lhotse|imageio-ffmpeg) " || true
      - name: Recognize
        env:
          ZIPA_SRC: ${{ runner.temp }}/zipa
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          AUDIO_REF: ${{ github.sha }}
        run: python3 scripts/phones.py ${{ matrix.model }} "${{ inputs.list }}" "out/${{ matrix.model }}_${{ matrix.shard }}.tsv" ${{ matrix.shard }}/${{ matrix.of }} --fetch-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phones-${{ matrix.model }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
  report:
    needs: recognize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            checks
            next
      - uses: actions/download-artifact@v4
        with: { pattern: "phones-*", path: out, merge-multiple: true }
      - name: Score and commit
        env: { LIST: "${{ inputs.list }}", MODELS: "${{ inputs.models }}" }
        run: |
          git config user.name "phones-bot"; git config user.email "phones-bot@users.noreply.github.com"
          DIR="checks/phones/$(basename "$LIST" .tsv)"
          for attempt in 1 2 3 4 5; do                       # another run may have pushed in the meantime
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            mkdir -p "$DIR/raw" && cp out/*.tsv "$DIR/raw/" 2>/dev/null || true
            python3 scripts/score_phones.py "$LIST" "$DIR/raw" "$DIR"
            git add "$DIR"
            git diff --cached --quiet && exit 0
            git commit -qm "checks: phone recognition of $LIST ($MODELS)"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
